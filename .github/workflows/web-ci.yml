name: Osprey Web Build

on:
  push:
    branches: [main, osprey-v12-makeover]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: osprey-flight-web
          path: dist
          if-no-files-found: error
